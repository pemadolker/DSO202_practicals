apiVersion: v1
kind: Namespace
metadata:
  labels:
    environment: dev
  name: webapp-dev
---
apiVersion: v1
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head><meta charset="utf-8"><title>webapp - dev</title></head>
    <body>
      <h1>DEV — Hello from Development</h1>
      <p>Environment: development</p>
    </body>
    </html>
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/name: webapp
    environment: dev
  name: web-content-2ttg7dbdck
  namespace: webapp-dev
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/name: webapp
    environment: dev
  name: webapp
  namespace: webapp-dev
spec:
  ports:
  - name: http
    port: 80
    targetPort: http
  selector:
    app.kubernetes.io/name: webapp
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: webapp
    environment: dev
  name: webapp
  namespace: webapp-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: webapp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: webapp
    spec:
      containers:
      - image: nginx:1.27-alpine
        name: webapp
        ports:
        - containerPort: 80
          name: http
        resources:
          limits:
            cpu: 100m
            memory: 128Mi
          requests:
            cpu: 50m
            memory: 64Mi
        volumeMounts:
        - mountPath: /usr/share/nginx/html
          name: web-content
          readOnly: true
      volumes:
      - configMap:
          name: web-content-2ttg7dbdck
        name: web-content
